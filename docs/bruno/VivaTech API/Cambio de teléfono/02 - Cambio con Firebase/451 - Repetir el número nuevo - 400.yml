# Esperado: 400 telefono_sin_cambios (confirma que Firebase guardó el número nuevo).
info:
  name: 451 - Repetir el número nuevo - 400
  type: http
  seq: 451

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidTelefonoP6}}/telefono"
  body:
    type: json
    data: |-
      { "telefono": "{{telefonoNuevoP6}}" }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
