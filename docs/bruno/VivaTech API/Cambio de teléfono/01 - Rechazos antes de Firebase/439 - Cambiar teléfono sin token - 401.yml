# Esperado: 401. No llega a PostgreSQL ni a Firebase.
info:
  name: 439 - Cambiar teléfono sin token - 401
  type: http
  seq: 439

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidTelefonoP6}}/telefono"
  body:
    type: json
    data: |-
      { "telefono": "{{telefonoNuevoP6}}" }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
