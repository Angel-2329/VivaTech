# Esperado: 403 rol_no_autorizado.
info:
  name: 441 - Maestro intenta cambiar teléfono - 403
  type: http
  seq: 441

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidTelefonoP6}}/telefono"
  body:
    type: json
    data: |-
      { "telefono": "{{telefonoNuevoP6}}" }
  auth:
    type: bearer
    token: "{{tokenMaestro}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
