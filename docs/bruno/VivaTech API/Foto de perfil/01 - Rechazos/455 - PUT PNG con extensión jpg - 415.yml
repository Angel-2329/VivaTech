# Esperado: 415 formato_no_permitido (la firma es PNG aunque el nombre y el tipo digan JPEG). No se crea archivo.
info:
  name: 455 - PUT PNG con extensión jpg - 415
  type: http
  seq: 455

http:
  method: PUT
  url: "{{baseUrl}}/api/perfil/foto"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - ../archivos-p7/no-es-foto.jpg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{tokenEstudiante}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
