# Esperado: 400 foto_requerida. No se crea archivo.
info:
  name: 454 - PUT foto con campo equivocado - 400
  type: http
  seq: 454

http:
  method: PUT
  url: "{{baseUrl}}/api/perfil/foto"
  body:
    type: multipart-form
    data:
      - name: imagen
        type: file
        value:
          - ../archivos-p7/foto-estudiante.jpg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{tokenEstudiante}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
