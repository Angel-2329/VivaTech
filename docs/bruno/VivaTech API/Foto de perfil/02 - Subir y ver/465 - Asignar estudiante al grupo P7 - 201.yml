# Esperado: 201 con tieneFoto true y fotoActualizada.
info:
  name: 465 - Asignar estudiante al grupo P7 - 201
  type: http
  seq: 465

http:
  method: POST
  url: "{{baseUrl}}/api/grupos/{{idGrupoP7}}/estudiantes"
  body:
    type: json
    data: |-
      {
        "uid": "{{uidEstudiante}}"
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
