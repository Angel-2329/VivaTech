# Esperado: 404 foto_no_encontrada aunque el maestro sí tiene foto (el estudiante no puede verla).
info:
  name: 469 - GET foto del maestro como estudiante - 404
  type: http
  seq: 469

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/{{uidMaestro}}/foto"
  auth:
    type: bearer
    token: "{{tokenEstudiante}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
