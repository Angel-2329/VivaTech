# Esperado: 400 telefono_invalido (el frontend quita espacios antes de enviar).
info:
  name: 443 - Teléfono con espacios - 400
  type: http
  seq: 443

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidTelefonoP6}}/telefono"
  body:
    type: json
    data: |-
      { "telefono": "+52 951 123 4567" }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
