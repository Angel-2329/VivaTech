# Esperado: 404 usuario_no_encontrado.
info:
  name: 415 - Dar permiso a uid inexistente - 404
  type: http
  seq: 415

http:
  method: POST
  url: "{{baseUrl}}/api/admin/cursos/{{idCursoP4}}/editores"
  body:
    type: json
    data: |-
      {
        "uid": "uid-inexistente-prueba-p4"
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
