# Esperado: 403 permiso_solo_edicion. El curso sigue existiendo.
info:
  name: 429 - Maestro con permiso intenta eliminar el curso - 403
  type: http
  seq: 429

http:
  method: DELETE
  url: "{{baseUrl}}/api/cursos/{{idCursoP4}}"
  auth:
    type: bearer
    token: "{{tokenMaestro}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
