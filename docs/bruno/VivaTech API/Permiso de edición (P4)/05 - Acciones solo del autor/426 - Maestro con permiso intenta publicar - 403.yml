# Esperado: 403 permiso_solo_edicion («Tienes permiso para editar este curso, pero no para esta acción.»).
info:
  name: 426 - Maestro con permiso intenta publicar - 403
  type: http
  seq: 426

http:
  method: PATCH
  url: "{{baseUrl}}/api/cursos/{{idCursoP4}}"
  body:
    type: json
    data: |-
      {
        "estadoPublicacion": "publicado"
      }
  auth:
    type: bearer
    token: "{{tokenMaestro}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
