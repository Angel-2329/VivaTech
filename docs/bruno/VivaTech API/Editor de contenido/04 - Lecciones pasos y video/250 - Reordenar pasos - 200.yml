info:
  name: 250 - Reordenar pasos - 200
  type: http
  seq: 250

http:
  method: PUT
  url: "{{baseUrl}}/api/lecciones/{{idLeccionLPV01A}}/orden-pasos"
  body:
    type: json
    data: |-
      { 
        "idsPasos": ["{{idPasoLPV01Extra}}", "{{idPasoLPV01Lectura}}", "{{idPasoLPV01Opcion}}"] 
      }
  auth:
    type: bearer
    token: "{{tokenMaestro}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
