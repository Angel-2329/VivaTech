# Copiar idCurso a idCursoEliminarBorrador. Se conservará vacío y sin evidencia.
info:
  name: 291 - Crear borrador vacío para eliminar - 201
  type: http
  seq: 291
http:
  method: POST
  url: "{{baseUrl}}/api/cursos"
  body:
    type: json
    data: |-
      {
        "idCategoria": "{{idCategoriaRetiro}}",
        "titulo": "[PRUEBA S4 RETIRO] Borrador vacío",
        "descripcion": "Curso ficticio vacío para probar eliminación física."
      }
  auth:
    type: bearer
    token: "{{tokenMaestro}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
