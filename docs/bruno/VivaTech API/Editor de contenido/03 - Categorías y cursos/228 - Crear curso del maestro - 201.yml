# Tras el 201, copiar idCurso a idCursoPruebaMaestro del entorno Local.
info:
  name: 228 - Crear curso del maestro - 201
  type: http
  seq: 228

http:
  method: POST
  url: "{{baseUrl}}/api/cursos"
  body:
    type: json
    data: |-
      {
        "idCategoria": "{{idCategoriaPruebaA}}",
        "titulo": "[PRUEBA S4 CC01] Curso del maestro",
        "descripcion": "Curso temporal para validar autoria y edicion."
      }
  auth:
    type: bearer
    token: "{{tokenNuevo}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
