info:
  name: 236 - Restaurar orden de categorías temporales - 200
  type: http
  seq: 236

http:
  method: PUT
  url: "{{baseUrl}}/api/categorias/orden"
  body:
    type: json
    data: |-
      {
        "idsCategorias": ["1", "2", "{{idCategoriaPruebaA}}", "{{idCategoriaPruebaB}}"]
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
