# Tras el 201, copiar idCurso a idCursoPruebaAdmin del entorno Local.
info:
  name: 229 - Crear curso del administrador - 201
  type: http
  seq: 229

http:
  method: POST
  url: "{{baseUrl}}/api/cursos"
  body:
    type: json
    data: |-
      {
        "idCategoria": "{{idCategoriaPruebaB}}",
        "titulo": "[PRUEBA S4 CC01] Curso del administrador",
        "descripcion": "Curso temporal del administrador."
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
