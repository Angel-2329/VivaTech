info:
  name: 285 - Rechazar despublicación con avance - 409
  type: http
  seq: 285

http:
  method: PATCH
  url: "{{baseUrl}}/api/cursos/{{idCursoPublicacion}}"
  body:
    type: json
    data: |-
      { 
        "estadoPublicacion": "borrador" 
      }
  auth:
    type: bearer
    token: "{{tokenNuevo}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
