# Copiar idPaso a idPasoPublicacionOpcion. Orden esperado 2.
info:
  name: 277 - Crear práctica de opción - 201
  type: http
  seq: 277
http:
  method: POST
  url: "{{baseUrl}}/api/lecciones/{{idLeccionPublicacion}}/pasos"
  body:
    type: json
    data: |-
      {
        "instruccion": "Elige qué datos usar para practicar.",
        "recursos": [],
        "actividad": {
          "tipo": "opcion",
          "pregunta": "¿Qué datos debes usar en esta práctica?",
          "opciones": [
            { "id": "a", "texto": "Datos ficticios" },
            { "id": "b", "texto": "Información bancaria real" }
          ],
          "correcta": "a",
          "pista": "La práctica no necesita tus datos reales.",
          "mensajeAcierto": "¡Muy bien! Practica sin compartir datos reales."
        }
      }
  auth:
    type: bearer
    token: "{{tokenMaestro}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
