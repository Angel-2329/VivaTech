info:
  name: 287 - Estudiante no cambia publicación - 403
  type: http
  seq: 287

http:
  method: PATCH
  url: "{{baseUrl}}/api/cursos/{{idCursoPublicacion}}"
  body:
    type: json
    data: |-
      { 
        "estadoPublicacion": "borrador" 
      }
  auth:
    type: bearer
    token: "{{tokenEstudiante}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
