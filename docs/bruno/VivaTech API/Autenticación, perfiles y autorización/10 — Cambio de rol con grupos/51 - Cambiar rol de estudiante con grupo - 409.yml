info:
  name: 51 - Cambiar rol de estudiante con grupo - 409
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidEstudiante}}/rol"
  body:
    type: json
    data: |-
      {
        "rol": "maestro"
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
