info:
  name: 34 - Maestro no puede cambiar roles - 403
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidEstudiante}}/rol"
  body:
    type: json
    data: |-
      {
        "rol": "maestro"
      }
  auth:
    type: bearer
    token: "{{tokenNuevo}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
