info:
  name: 30 - Administrador asigna rol maestro - 200
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidNuevo}}/rol"
  body:
    type: json
    data: |-
      {
        "rol": "maestro"
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
