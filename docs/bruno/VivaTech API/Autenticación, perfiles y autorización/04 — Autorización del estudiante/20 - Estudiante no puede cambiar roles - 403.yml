info:
  name: 20 - Estudiante no puede cambiar roles - 403
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidEstudiante}}/rol"
  body:
    type: json
    data: |-
      {
        "rol": "maestro"
      }
  auth:
    type: bearer
    token: "{{tokenEstudiante}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
