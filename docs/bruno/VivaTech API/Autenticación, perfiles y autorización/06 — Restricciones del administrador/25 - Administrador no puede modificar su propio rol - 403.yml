info:
  name: 25 - Administrador no puede modificar su propio rol - 403
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/{{uidAdministrador}}/rol"
  body:
    type: json
    data: |-
      {
        "rol": "administrador"
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
