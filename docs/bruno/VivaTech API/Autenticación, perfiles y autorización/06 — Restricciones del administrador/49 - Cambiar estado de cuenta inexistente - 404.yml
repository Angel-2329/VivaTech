info:
  name: 49 - Cambiar estado de cuenta inexistente - 404
  type: http
  seq: 21

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/usuarios/uid-inexistente-prueba-bruno/activo"
  body:
    type: json
    data: |-
      {
        "activo": true
      }
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
