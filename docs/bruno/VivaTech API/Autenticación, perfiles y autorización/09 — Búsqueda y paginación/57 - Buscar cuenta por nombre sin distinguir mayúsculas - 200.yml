info:
  name: 57 - Buscar cuenta por nombre sin distinguir mayúsculas - 200
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/admin/usuarios?buscar=MAESTRO&limite=10&desplazamiento=0"
  params:
    - name: buscar
      value: MAESTRO
      type: query
    - name: limite
      value: "10"
      type: query
    - name: desplazamiento
      value: "0"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdministrador}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
