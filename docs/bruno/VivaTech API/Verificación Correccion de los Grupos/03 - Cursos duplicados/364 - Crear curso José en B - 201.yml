  url: "{{baseUrl}}/api/cursos"
  body:
    type: json
    data: |-
      {
        "idCategoria": "{{idCategoriaF1B}}",
        "titulo": "[PRUEBA F1] José",
        "descripcion": "Curso ficticio de la verificación F.1."
